# Model change proposal. Submitted by the product team, decided by the governance board.
id: MCP-2026-014
title: Upgrade Nova Assist from v1 (gpt-oss-20b) to v2 (gpt-oss-120b)
system: Nova Assist (NovaBank customer support assistant)
submitted_by: {name: Priya Raman, role: Product Owner, team: Customer Experience}
owner: {name: Priya Raman, role: Product Owner}
technical_owner: {name: Tomás Okafor, role: ML Platform Lead}
approvers_required: [Model Risk Officer, Governance Board]

change:
  from: {nova_version: v1, gateway_route: nova-v1, provider_model: groq/openai/gpt-oss-20b}
  to:   {nova_version: v2, gateway_route: nova-v2, provider_model: groq/openai/gpt-oss-120b}
  unchanged: [system prompt (governance/policy.md), temperature 0.2, max_tokens 1024, gateway, app]

business_justification: >
  Customer satisfaction surveys show 18% of Nova Assist conversations end with "the answer was not
  specific enough", most often for loans, mortgages and disputed ATM withdrawals. The product team
  believes a larger model will give more complete, more accurate step-by-step answers and reduce
  escalations to human agents, which cost NovaBank about EUR 4 per contact.

intended_use:
  - Answer retail-banking customer questions on cards, accounts, transfers, loans, mortgages, ATMs, fees and passwords.
  - Explain how to do a task in the NovaBank app or online banking, and escalate to a human when needed.
out_of_scope_use:
  - Personal financial, investment, tax or legal advice.
  - Taking actions on accounts (payments, blocking cards); the assistant only explains how to.
  - Handling full card numbers, PINs, passwords or one-time codes.
  - Credit decisions or any decision with legal effect on a customer.

risk:
  tier: medium   # customer-facing generative AI; no automated decisions with legal effect
  assessment:
    - {risk: Unsafe answers (asking for credentials, giving investment advice), likelihood: low, impact: high,
       control: "Policy-compliance and red-team metrics in the offline gate; zero critical violations in shadow"}
    - {risk: Wrong or invented banking information, likelihood: medium, impact: medium,
       control: "Correctness vs golden references; per-intent slice comparison so one area cannot hide a regression"}
    - {risk: Higher latency and cost of a larger model, likelihood: high, impact: low,
       control: "Latency and cost ratios in the canary/rollout gate; budget-limited gateway keys"}
    - {risk: Regression appears only on live traffic, likelihood: low, impact: medium,
       control: "Shadow, then 10% canary, then 25/50/100% with automatic rollback"}
  regulatory_context: >
    EU AI Act: customer-service chatbots carry transparency obligations (Art. 50) and are not high-risk
    under Annex III unless they make credit decisions. NovaBank still applies its SR 11-7 style model
    risk management to every customer-facing model.

expected_cost_impact:
  pricing_source: "Groq on-demand pricing (console.groq.com/docs/models), per 1M tokens"
  prices_usd_per_1m_tokens:
    v1: {input: 0.075, output: 0.30}
    v2: {input: 0.15, output: 0.60}
  assumptions: {prompt_tokens_per_request: 414, completion_tokens_per_request: 150}   # measured on a real call
  estimated_cost_per_1k_requests_usd: {v1: 0.076, v2: 0.152}
  estimated_monthly_cost_usd_at_500k_requests: {v1: 38, v2: 76}
  note: "Estimate only. Stage 2 measures the real cost per 1K requests and the console shows both."

success_criteria:
  - All offline thresholds in governance/policy.yaml are met, with no safety regression against v1.
  - Shadow: challenger wins or ties at least 60% of pairwise judgements, zero critical violations.
  - Canary and rollout: error rate, p95 latency ratio, cost ratio and sampled quality within policy.

rollback_plan: >
  v1 stays registered (alias @retired after promotion, never deleted) and remains a live gateway
  route (nova-v1). Any gate breach during canary or rollout automatically resets the production
  route to 100% v1 and logs an incident. Manual rollback is one console action.

monitoring_after_promotion:
  - Scheduled or on-demand re-evaluation of @champion on the golden set (drift check, Stage 7).
  - LiteLLM spend and error logs per model version.
